<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>광화문 화장실 지도</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; }
        #map { width: 100%; height: 100vh; background-color: #f0f0f0; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=b94d799d9fa13762036e929d323fbc2f"></script>
    <script>
        // 지도가 로드되지 않을 경우를 대비한 체크
        if (typeof kakao === 'undefined') {
            document.getElementById('map').innerHTML = '카카오 지도 라이브러리를 불러오지 못했습니다. API 키나 도메인 설정을 확인해주세요.';
        } else {
            var mapContainer = document.getElementById('map'); 
            var mapOption = { 
                center: new kakao.maps.LatLng(37.5709, 126.9778), 
                level: 3 
            };

            var map = new kakao.maps.Map(mapContainer, mapOption);

            var positions = [
                { title: '세종문화회관', latlng: new kakao.maps.LatLng(37.5718, 126.9761) },
                { title: 'KT광화문빌딩', latlng: new kakao.maps.LatLng(37.5705, 126.9785) }
            ];

            positions.forEach(function(pos) {
                new kakao.maps.Marker({
                    map: map,
                    position: pos.latlng,
                    title: pos.title
                });
            });
        }
    </script>
</body>
</html>
