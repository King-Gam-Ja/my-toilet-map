<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>광화문 화장실 지도</title>
    <style>
        #map { width: 100%; height: 100vh; } /* 화면 전체를 지도로 사용 */
    </style>
</head>
<body>
    <div id="map"></div>

    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=b94d799d9fa13762036e929d323fbc2f"></script>
    <script>
        var mapContainer = document.getElementById('map'); 
        var mapOption = { 
            center: new kakao.maps.LatLng(37.5709, 126.9778), // 광화문 광장 좌표
            level: 3 
        };

        var map = new kakao.maps.Map(mapContainer, mapOption);

        // 화장실 위치 예시 (1단계에서 얻은 데이터를 여기에 넣는 거예요!)
        var positions = [
            { title: '세종문화회관', latlng: new kakao.maps.LatLng(37.5718, 126.9761) },
            { title: 'KT광화문빌딩', latlng: new kakao.maps.LatLng(37.5705, 126.9785) }
        ];

        positions.forEach(function(pos) {
            new kakao.maps.Marker({
                map: map,
                position: pos.latlng,
                title: pos.title
            });
        });
    </script>
</body>
</html>
