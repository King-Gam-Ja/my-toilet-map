<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>광화문 화장실 지도</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; }
        #map { width: 100%; height: 100vh; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=b94d799d9fa13762036e929d323fbc2f&libraries=services"></script>
    
    <script>
        // 페이지가 완전히 로드된 후 지도를 생성합니다
        kakao.maps.load(function() {
            var mapContainer = document.getElementById('map'); 
            var mapOption = { 
                center: new kakao.maps.LatLng(37.5709, 126.9778), 
                level: 3 
            };

            var map = new kakao.maps.Map(mapContainer, mapOption);

            var positions = [
                { title: '세종문화회관', latlng: new kakao.maps.LatLng(37.5718, 126.9761) },
                { title: 'KT광화문빌딩', latlng: new kakao.maps.LatLng(37.5705, 126.9785) }
            ];

            positions.forEach(function(pos) {
                new kakao.maps.Marker({
                    map: map,
                    position: pos.latlng,
                    title: pos.title
                });
            });
        });
    </script>
</body>
</html>
